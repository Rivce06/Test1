apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mern-app.fullname" . }}-backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "mern-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "mern-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "mern-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "mern-app.fullname" . }}-config
            - secretRef:
                name: {{ include "mern-app.fullname" . }}-secret
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
